apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: grafana
  ports:
    - name: http
      port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 3000 }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
      protocol: TCP

